<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's "HINAKO SOGA"</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-navy: #233b6c;
            --accent-yellow: #FBE37E;
            --accent-yellow-hover: #f5d85c;
            --text-main: #233b6c;
            --text-sub: #4a5d82;
            --border-color: #dbe2ef;
        }

        * {
            box-sizing: border-box;
            font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 36px 24px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(35, 59, 108, 0.08);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .header-tag {
            display: inline-block;
            background: var(--primary-navy);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.08em;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-navy);
            margin: 0 0 12px 0;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.02em;
        }

        .sub-title {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.6;
            text-align: center;
            word-break: normal;
            overflow-wrap: anywhere;
        }

        /* PCのみ改行を入れるクラス */
        .pc-only {
            display: inline;
        }

        /* スロット部分 */
        .slot-container {
            background: #fafbfc;
            border: 2px solid var(--primary-navy);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 10px;
            min-height: 48px;
        }

        .slot-label {
            font-weight: 700;
            color: var(--primary-navy);
            font-size: 0.85rem;
            width: 54px;
            flex-shrink: 0;
            background: var(--accent-yellow);
            padding: 4px 0;
            border-radius: 6px;
            text-align: center;
        }

        .slot-window {
            flex: 1;
            height: 32px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .slot-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-navy);
            line-height: 1.3;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }

        .slot-text.spinning {
            animation: slotSpin 0.08s infinite linear;
        }

        .slot-text.placeholder {
            color: #a0aec0;
            font-weight: normal;
        }

        @keyframes slotSpin {
            0% { transform: translateY(-100%); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0.3; }
        }

        .stop-btn {
            background-color: var(--primary-navy);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .stop-btn:hover {
            opacity: 0.9;
        }

        .stop-btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        /* メイン操作ボタン */
        .main-btn {
            background-color: var(--accent-yellow);
            color: var(--primary-navy);
            border: 2px solid var(--primary-navy);
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0px var(--primary-navy);
            width: 100%;
        }

        .main-btn:hover {
            background-color: var(--accent-yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 0px var(--primary-navy);
        }

        .main-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px var(--primary-navy);
        }

        /* スマホ向けレスポンシブスタイル (画面幅480px以下) */
        @media screen and (max-width: 480px) {
            body {
                padding: 12px 8px;
            }

            .card {
                padding: 24px 16px;
                border-radius: 18px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .sub-title {
                font-size: 0.82rem;
                margin-bottom: 18px;
                line-height: 1.5;
            }

            /* スマホではPC用改行を非表示にして自然に流す */
            .pc-only {
                display: none;
            }

            .slot-container {
                padding: 10px 8px;
                gap: 10px;
            }

            .slot-row {
                padding: 6px 8px;
                gap: 6px;
            }

            .slot-label {
                width: 46px;
                font-size: 0.78rem;
                padding: 3px 0;
            }

            .slot-text {
                font-size: 0.85rem;
            }

            .stop-btn {
                padding: 6px 8px;
                font-size: 0.72rem;
            }

            .main-btn {
                font-size: 0.95rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <span class="header-tag">PROFILE GENERATOR</span>
    <h1>What's "HINAKO SOGA"</h1>
    
    <p class="sub-title">
        ここに出てくるフレーズは全部、周りから見る曽我日向子。<br class="pc-only">
        家族や20年来の友人、バイトの同期はもちろん、<br class="pc-only">
        よく行くお店で知り合った常連さんや大学の教授まで？！<br class="pc-only">
        その場限りの自己紹介を作ります！
    </p>
    
    <div class="slot-container">
        <!-- 一見 -->
        <div class="slot-row">
            <span class="slot-label">一見</span>
            <div class="slot-window">
                <span class="slot-text placeholder" id="slotA">????</span>
            </div>
            <button class="stop-btn" id="btnA" onclick="stopIndividual('A')" disabled>ストップ</button>
        </div>

        <!-- 実は -->
        <div class="slot-row">
            <span class="slot-label">実は</span>
            <div class="slot-window">
                <span class="slot-text placeholder" id="slotB">????</span>
            </div>
            <button class="stop-btn" id="btnB" onclick="stopIndividual('B')" disabled>ストップ</button>
        </div>

        <!-- 結論 -->
        <div class="slot-row">
            <span class="slot-label">結論</span>
            <div class="slot-window">
                <span class="slot-text placeholder" id="slotC">???? です！</span>
            </div>
            <button class="stop-btn" id="btnC" onclick="stopIndividual('C')" disabled>ストップ</button>
        </div>
    </div>

    <button class="main-btn" id="mainBtn" onclick="toggleAll()">🎰 スロットを回す！</button>
</div>

<script>
    const partA = [
        "動物になめられそうだけど",
        "肉きらいそうに見えて",
        "はじめて発したコトバは「カエルさん」な",
        "オコジョ飼ってそうだけど",
        "お腹弱そう、、、だけど",
        "運動オンチそうな"
    ];

    const partB = [
        "サボテンを育てたことがある",
        "どうでもいいことをよく覚えている",
        "コンビニアイス大体制覇！な",
        "割とよく食べる",
        "ガチャガチャ永遠にみている",
        "売れるバンド青田買い打率5割の",
        "あごの力が弱い",
        "三度の飯より活字好き",
        "お父さんが阿部寛に似ている",
        "機嫌はお寿司で取る"
    ];

    const partC = [
        "シス単マスター",
        "長風呂",
        "ごはん屋さん探しの天才",
        "アボカド好き",
        "物は忘れるが恩は忘れない義理義理ガール",
        "「広告でよく見るクソゲー」マー"
    ];

    let timerA = null, timerB = null, timerC = null;
    let isSpinningA = false, isSpinningB = false, isSpinningC = false;

    function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function startSpin(elementId, array) {
        const el = document.getElementById(elementId);
        el.classList.remove('placeholder');
        el.classList.add('spinning');
        return setInterval(() => {
            el.textContent = getRandomItem(array);
        }, 60);
    }

    function stopSpin(timerId, elementId, finalValue, suffix = '') {
        clearInterval(timerId);
        const el = document.getElementById(elementId);
        el.classList.remove('spinning');
        el.textContent = finalValue + suffix;
    }

    function toggleAll() {
        const mainBtn = document.getElementById('mainBtn');
        const isAnySpinning = isSpinningA || isSpinningB || isSpinningC;

        if (!isAnySpinning) {
            // 全回転開始
            timerA = startSpin('slotA', partA); isSpinningA = true;
            timerB = startSpin('slotB', partB); isSpinningB = true;
            timerC = startSpin('slotC', partC); isSpinningC = true;

            document.getElementById('btnA').disabled = false;
            document.getElementById('btnB').disabled = false;
            document.getElementById('btnC').disabled = false;

            mainBtn.textContent = "🛑 すべてストップ！";
        } else {
            // 全停止
            if (isSpinningA) stopIndividual('A');
            if (isSpinningB) stopIndividual('B');
            if (isSpinningC) stopIndividual('C');
        }
    }

    function stopIndividual(target) {
        if (target === 'A' && isSpinningA) {
            stopSpin(timerA, 'slotA', getRandomItem(partA));
            isSpinningA = false;
            document.getElementById('btnA').disabled = true;
        } else if (target === 'B' && isSpinningB) {
            stopSpin(timerB, 'slotB', getRandomItem(partB));
            isSpinningB = false;
            document.getElementById('btnB').disabled = true;
        } else if (target === 'C' && isSpinningC) {
            stopSpin(timerC, 'slotC', getRandomItem(partC), ' です！');
            isSpinningC = false;
            document.getElementById('btnC').disabled = true;
        }

        // 全て止まったらボタン表示を戻す
        if (!isSpinningA && !isSpinningB && !isSpinningC) {
            document.getElementById('mainBtn').textContent = " もう一度まわす！";
        }
    }
</script>

</body>
</html>
